# Fast GPU-free gates for the fork-owned server build and release control plane.
# Upstream engine correctness remains covered by the Windows build and optional GPU suite;
# obsolete launcher/profile documentation is outside this personal server-only release contract.
name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  fast-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install control-plane test dependencies
        run: python -m pip install --quiet -r automation/requirements.txt
      - name: Automation and cache contracts
        run: |
          python automation/test_automation.py -q
          python automation/test_cache.py -q
      - name: Relevant static gates
        run: |
          python tools/release/check_text_encoding.py
          python tools/release/check_subprocess_encoding.py
          python tools/release/check_dead_types.py
          python tools/release/check_duplication.py
