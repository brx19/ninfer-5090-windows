name: BRX sync build and release

on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [dev]
    paths: ['automation/**', '.github/workflows/brx-sync-build.yml']
  workflow_dispatch:
    inputs:
      force_build:
        type: boolean
        default: false
        description: Rebuild even if source and dependency pins did not change
      cuda_cache:
        type: boolean
        default: false
        description: Route NVCC through sccache as well (off until the CUDA cache is proven for this toolchain)

permissions:
  contents: read

concurrency:
  group: brx-update-pipeline
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'brx19/ninfer-5090-windows'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      candidate: ${{ steps.sync.outputs.candidate }}
      sha: ${{ steps.sync.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install automation test dependencies
        run: python -m pip install --quiet -r automation/requirements.txt
      - name: Verify synchronization and packaging guards
        run: python automation/test_automation.py -q
      - name: Synchronize headpiece and pin dependencies
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ inputs.force_build || false }}
        run: |
          args=()
          if [ "$FORCE_BUILD" = "true" ]; then args+=(--force-build); fi
          python automation/sync.py "${args[@]}"
      - name: Save merge-conflict evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sync-conflict-${{ github.run_id }}
          path: automation-conflict.log
          if-no-files-found: ignore

  build:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: windows-2025
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.sync.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: '13.3.0'
          method: network
          sub-packages: '["nvcc", "crt", "cudart", "thrust", "nvrtc", "nvrtc_dev", "nvjitlink", "nvfatbin", "nvtx", "nvvm", "visual_studio_integration"]'

      # --- Build caches ---------------------------------------------------------
      # Four independent layers under D:\ninfer-cache, each a separate actions/cache
      # entry so one corrupted or oversized layer never drags the others down:
      #   sccache-cpp / sccache-cuda  compiler output (separate servers, separate stats)
      #   vcpkg                     shared partial clone at the pinned SHA
      #   vcpkg-bin                 filesystem binary provider (supported x-gha successor)
      #   ffmpeg                    the archive, content-addressed by its locked SHA256
      # Nothing here is keyed to the candidate commit, upstream HEAD, or run ID: keys
      # are OS/arch + MSVC toolset + CUDA version + sm_120a + flag fingerprint +
      # dependency fingerprint + cache schema. Fallback restore-keys drop volatile
      # components so an incremental change restores the old cache; per-entry
      # correctness is enforced by the caches themselves (sccache content addressing,
      # vcpkg binary hashes, archive SHA256). No secrets ever enter these paths.

      - name: Install pinned sccache
        shell: pwsh
        run: |
          $Settings = Get-Content -LiteralPath "automation/settings.json" -Raw | ConvertFrom-Json
          $Pin = $Settings.build_cache.sccache
          $BinDir = Join-Path "D:\ninfer-cache" "sccache-bin"
          New-Item -ItemType Directory -Force -Path $BinDir | Out-Null
          $Zip = Join-Path $env:RUNNER_TEMP "sccache.zip"
          Invoke-WebRequest -Uri $Pin.url -OutFile $Zip
          $Hash = (Get-FileHash -LiteralPath $Zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($Hash -ne $Pin.sha256) { throw "sccache archive SHA256 mismatch: expected $($Pin.sha256), got $Hash" }
          Expand-Archive -LiteralPath $Zip -DestinationPath (Join-Path $env:RUNNER_TEMP "sccache-extract")
          $Exe = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP "sccache-extract") -Recurse -Filter sccache.exe | Select-Object -First 1
          Copy-Item -LiteralPath $Exe.FullName -Destination (Join-Path $BinDir "sccache.exe") -Force
          & (Join-Path $BinDir "sccache.exe") --version
          Write-Host "sccache $($Pin.version) installed; SHA256 verified against automation/settings.json"

      - name: Compute cache keys
        id: cache-keys
        shell: pwsh
        run: |
          $Lock = Get-Content -LiteralPath "automation/dependencies.lock.json" -Raw | ConvertFrom-Json
          $Settings = Get-Content -LiteralPath "automation/settings.json" -Raw | ConvertFrom-Json
          $VsWhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $VsRoot = & $VsWhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $VsRoot) { throw "Visual Studio Desktop C++ workload not found" }
          $MsvcVersion = (Get-ChildItem (Join-Path $VsRoot "VC\Tools\MSVC") | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1).Name
          # Fingerprint of every file that defines compile flags, link behavior, or build
          # arguments. Any change moves the exact key; the fallback keys still restore the
          # old cache, and per-entry content addressing decides what actually hits.
          $FlagFiles = @((git ls-files -- 'CMakeLists.txt' 'cmake/*' 'apps/CMakeLists.txt' 'src/CMakeLists.txt' 'src/*/CMakeLists.txt' 'src/*/*/CMakeLists.txt' 'tests/CMakeLists.txt' 'bench/CMakeLists.txt' 'third_party/*/CMakeLists.txt' 'automation/build.ps1') | Sort-Object)
          if ($FlagFiles.Count -eq 0) { throw "Flag fingerprint found no CMake files; refusing to compute a cache key" }
          $FlagHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes(($FlagFiles | ForEach-Object { (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash }) -join "|"))).ToLowerInvariant().Substring(0, 16)
          $DepHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes("$($Lock.vcpkg_sha)$($Lock.ffmpeg.sha256)$($Lock.cuda_version)"))).ToLowerInvariant().Substring(0, 16)
          $Os = $env:RUNNER_OS.ToLowerInvariant()
          $Arch = $env:RUNNER_ARCH.ToLowerInvariant()
          $Schema = $Settings.build_cache.schema
          $SccPrefix = "ninfer-cache$Schema-sccache-$Os-$Arch-msvc$MsvcVersion-cuda$($Lock.cuda_version)-sm120a"
          $SccacheKey = "$($SccPrefix)-flags$FlagHash-deps$DepHash-sc$($Settings.build_cache.sccache.version)"
          $Out = @(
            "sccache_key=$SccacheKey",
            "sccache_restore1=$($SccPrefix)-flags$FlagHash-",
            "sccache_restore2=$($SccPrefix)-",
            "sccache_restore3=ninfer-cache$Schema-sccache-$Os-$Arch-",
            "vcpkgsrc_key=ninfer-cache$Schema-vcpkgsrc-$Os-$Arch-$($Lock.vcpkg_sha)",
            "vcpkgbin_key=ninfer-cache$Schema-vcpkgbin-$Os-$Arch-msvc$MsvcVersion-triplet-x64-windows-vcpkg$($Lock.vcpkg_sha)",
            "vcpkgbin_restore=ninfer-cache$Schema-vcpkgbin-$Os-$Arch-msvc$MsvcVersion-triplet-x64-windows-",
            "ffmpeg_key=ninfer-cache$Schema-ffmpeg-$($Lock.ffmpeg.sha256)"
          )
          Set-Content -LiteralPath $env:GITHUB_OUTPUT -Value $Out
          Write-Host "MSVC toolset      : $MsvcVersion"
          Write-Host "flag fingerprint  : $FlagHash"
          Write-Host "dependency hash   : $DepHash"
          Write-Host "sccache key       : $SccacheKey"
          Write-Host "vcpkg checkout key: $($Out[3].Substring(13))"
          Write-Host "vcpkg binary key  : $($Out[4].Substring(13))"
          Write-Host "ffmpeg key        : $($Out[6].Substring(11))"

      - name: Restore compiler caches
        id: compiler-caches
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            D:\ninfer-cache\sccache-cpp
            D:\ninfer-cache\sccache-cuda
          key: ${{ steps.cache-keys.outputs.sccache_key }}
          restore-keys: |
            ${{ steps.cache-keys.outputs.sccache_restore1 }}
            ${{ steps.cache-keys.outputs.sccache_restore2 }}
            ${{ steps.cache-keys.outputs.sccache_restore3 }}

      - name: Restore vcpkg checkout
        id: vcpkg-checkout
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\ninfer-cache\vcpkg
          key: ${{ steps.cache-keys.outputs.vcpkgsrc_key }}

      - name: Restore vcpkg binary cache
        id: vcpkg-binary
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\ninfer-cache\vcpkg-bin
          key: ${{ steps.cache-keys.outputs.vcpkgbin_key }}
          restore-keys: |
            ${{ steps.cache-keys.outputs.vcpkgbin_restore }}

      - name: Restore FFmpeg archive
        id: ffmpeg
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\ninfer-cache\ffmpeg
          key: ${{ steps.cache-keys.outputs.ffmpeg_key }}

      - name: Validate Python automation
        shell: pwsh
        run: python -m compileall -q automation
      - name: Configure build and package Windows runtime
        shell: pwsh
        env:
          NINFER_CACHE_ROOT: D:\ninfer-cache
          NINFER_SCCACHE: D:\ninfer-cache\sccache-bin\sccache.exe
          NINFER_SCCACHE_CUDA: ${{ inputs.cuda_cache && 'on' || 'off' }}
        run: ./automation/build.ps1
      - name: Report cache metrics
        if: always()
        id: cache-metrics
        shell: pwsh
        env:
          COMPILER_CACHE_HIT: ${{ steps['compiler-caches'].outputs['cache-hit'] }}
          VCPKG_SOURCE_CACHE_HIT: ${{ steps['vcpkg-checkout'].outputs['cache-hit'] }}
          VCPKG_BINARY_CACHE_HIT: ${{ steps['vcpkg-binary'].outputs['cache-hit'] }}
          FFMPEG_CACHE_HIT: ${{ steps['ffmpeg'].outputs['cache-hit'] }}
        run: |
          $Lines = New-Object System.Collections.Generic.List[string]
          $Lines.Add("## NInfer build cache report")
          $Metrics = $null
          if (Test-Path "build/cache-metrics.json") { $Metrics = Get-Content -LiteralPath "build/cache-metrics.json" -Raw | ConvertFrom-Json }
          if ($null -ne $Metrics) {
              $Lines.Add("| metric | value |")
              $Lines.Add("| --- | --- |")
              foreach ($Prop in $Metrics.PSObject.Properties) {
                  $Value = [string]$Prop.Value
                  if ($Value.Length -gt 300) { $Value = $Value.Substring(0, 300) + "..." }
                  $Lines.Add("| $($Prop.Name) | $($Value -replace '\|', '/' -replace "`r?`n", ' ') |")
              }
          } else {
              $Lines.Add("no cache metrics written (the build script did not reach its metrics step)")
          }
          $Flags = New-Object System.Collections.Generic.List[string]
          foreach ($Name in @("COMPILER", "VCPKG_SOURCE", "VCPKG_BINARY", "FFMPEG")) {
              $Hit = [string][System.Environment]::GetEnvironmentVariable($Name + "_CACHE_HIT")
              if ($Hit.Trim().Length -gt 0) { $Flags.Add("$Name cache-hit=$Hit") } else { $Flags.Add("$Name cache-hit=unavailable") }
          }
          if ($Flags.Count) { $Lines.Add("actions/cache restore: " + ($Flags -join '; ')) }
          # Storage budget guard: never let a save push this repo past its 10 GB cache quota.
          $UsedBytes = 0
          if (Test-Path "D:\ninfer-cache") {
              $Sum = (Get-ChildItem -Path "D:\ninfer-cache" -Recurse -File -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum
              if ($null -ne $Sum) { $UsedBytes = [int64]$Sum }
          }
          $Lines.Add("cache root usage: {0:N2} GiB (save guard: 7 GiB)" -f ($UsedBytes / 1GB))
          $Save = if ($UsedBytes -lt 7GB) { "true" } else { "false" }
          if ($Save -eq "false") { $Lines.Add("cache save BLOCKED: cache root exceeds the 7 GiB budget; next run starts from a cold cache") }
          $Lines | Set-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          Set-Content -LiteralPath $env:GITHUB_OUTPUT -Value "save_enabled=$Save"
      - name: Save release archive and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ninfer-runtime-${{ github.run_id }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
      # Explicit saves after the release archive. The restore steps use
      # actions/cache/restore (no implicit end-of-job save), so these explicit saves are
      # the only path that persists cache contents. Nothing is persisted from a failed
      # build, and a save is skipped when its restore step reports an exact cache hit.
      # A save failure (quota, service) must never fail the job or block publication, so
      # each save is guarded by the 7 GiB budget check and allowed to fail.
      - name: Save compiler caches
        if: success() && steps.cache-metrics.outputs.save_enabled == 'true' && steps['compiler-caches'].outputs['cache-hit'] != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            D:\ninfer-cache\sccache-cpp
            D:\ninfer-cache\sccache-cuda
          key: ${{ steps.cache-keys.outputs.sccache_key }}
      - name: Save vcpkg checkout
        if: success() && steps.cache-metrics.outputs.save_enabled == 'true' && steps['vcpkg-checkout'].outputs['cache-hit'] != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\ninfer-cache\vcpkg
          key: ${{ steps.cache-keys.outputs.vcpkgsrc_key }}
      - name: Save vcpkg binary cache
        if: success() && steps.cache-metrics.outputs.save_enabled == 'true' && steps['vcpkg-binary'].outputs['cache-hit'] != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\ninfer-cache\vcpkg-bin
          key: ${{ steps.cache-keys.outputs.vcpkgbin_key }}
      - name: Save FFmpeg archive
        if: success() && steps.cache-metrics.outputs.save_enabled == 'true' && steps['ffmpeg'].outputs['cache-hit'] != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\ninfer-cache\ffmpeg
          key: ${{ steps.cache-keys.outputs.ffmpeg_key }}
      - name: Save build diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build-diagnostics-${{ github.run_id }}
          path: |
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/cache-metrics.json
            build/binary-fingerprint.txt
            automation/dependencies.lock.json
            D:\ninfer-cache\sccache-error.log
          if-no-files-found: ignore

  candidate-release:
    # Skipped when synchronization produced no new candidate: there is nothing to publish and
    # the build artifacts would not exist. Publishing only a candidate that was actually built
    # keeps the prerelease trail a true record of distinct runtime candidates.
    needs: [sync, build]
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.sync.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ninfer-runtime-${{ github.run_id }}
          path: dist
      - name: Publish immutable-source prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.sync.outputs.sha }}
          CANDIDATE_BRANCH: ${{ needs.sync.outputs.candidate }}
        run: python automation/publish.py --sha "$CANDIDATE_SHA" --candidate "$CANDIDATE_BRANCH"

  gpu:
    needs: [sync, build, candidate-release]
    # Optional qualification: it runs only when explicitly enabled AND when a new candidate
    # exists. The runner label matches gpu.yml's registration convention (self-hosted runner
    # registered on this repository as '5090-box' with the gpu-5090 label); until a runner is
    # registered on this repository, leaving the flag enabled would queue this job forever,
    # which is why the flag is off by default and never blocks the build.
    if: needs.sync.outputs.changed == 'true' && vars.ENABLE_GPU_QUALIFICATION == 'true'
    runs-on: [self-hosted, windows, gpu-5090]
    timeout-minutes: 330
    concurrency:
      group: gpu-5090
      cancel-in-progress: false
    env:
      NINFER_TEST_ARTIFACT: ${{ vars.NINFER_TEST_ARTIFACT }}
      NINFER_CUDA_PATH: ${{ vars.NINFER_CUDA_PATH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.sync.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ninfer-runtime-${{ github.run_id }}
          path: dist
      - name: Run the source suite and required-model gate
        shell: pwsh
        run: ./automation/build.ps1 -GpuTests
      - name: Test the exact published binary
        shell: pwsh
        run: python automation/gpu_smoke.py --artifact "$env:NINFER_TEST_ARTIFACT"
      - name: Save qualification and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-${{ github.run_id }}
          path: |
            dist/qualification.json
            dist/gpu-smoke-server.log
            build-test/Testing/Temporary/*.log
          if-no-files-found: ignore

  integrate:
    needs: [sync, build, candidate-release, gpu]
    if: always() && needs.build.result == 'success' && needs.candidate-release.result == 'success' && (needs.gpu.result == 'success' || needs.gpu.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.sync.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ninfer-runtime-${{ github.run_id }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.gpu.result == 'success'
        with:
          name: qualification-${{ github.run_id }}
          path: dist
      - name: Promote GPU-qualified release and integrate candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.sync.outputs.sha }}
          CANDIDATE_BRANCH: ${{ needs.sync.outputs.candidate }}
          GPU_RESULT: ${{ needs.gpu.result }}
        run: |
          args=(--sha "$CANDIDATE_SHA" --candidate "$CANDIDATE_BRANCH" --integrate)
          if [ "$GPU_RESULT" = "success" ]; then args+=(--qualified); fi
          python automation/publish.py "${args[@]}"
