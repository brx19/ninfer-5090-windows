name: BRX cache verification

# Scratch workflow for proving the build-cache behavior on hosted Windows runners
# without touching the release pipeline. It builds the checked-out ref directly (no
# sync, no candidate, no publication, no GPU job), so a candidate is never published
# from a verification run. Inputs map to the verification scenarios:
#   cuda_cache    - route NVCC through sccache (off by default, off until proven)
#   corrupt_cache - after restoring the compiler cache, corrupt a few sccache entries
#                   to prove that per-entry content addressing degrades to a recompile
#                   instead of producing a wrong binary
on:
  workflow_dispatch:
    inputs:
      cuda_cache:
        description: Route NVCC through sccache (R7 parity run)
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
      corrupt_cache:
        description: Corrupt restored sccache entries to verify safe fallback (R6)
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

concurrency:
  group: cache-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: '13.3.0'
          method: network
          sub-packages: '["nvcc", "crt", "cudart", "thrust", "nvrtc", "nvrtc_dev", "nvjitlink", "nvfatbin", "nvtx", "nvvm", "visual_studio_integration"]'
      - name: Install pinned sccache
        shell: pwsh
        run: |
          $Settings = Get-Content -LiteralPath "automation/settings.json" -Raw | ConvertFrom-Json
          $Pin = $Settings.build_cache.sccache
          $BinDir = Join-Path "D:\ninfer-cache" "sccache-bin"
          New-Item -ItemType Directory -Force -Path $BinDir | Out-Null
          $Zip = Join-Path $env:RUNNER_TEMP "sccache.zip"
          Invoke-WebRequest -Uri $Pin.url -OutFile $Zip
          $Hash = (Get-FileHash -LiteralPath $Zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($Hash -ne $Pin.sha256) { throw "sccache archive SHA256 mismatch: expected $($Pin.sha256), got $Hash" }
          Expand-Archive -LiteralPath $Zip -DestinationPath (Join-Path $env:RUNNER_TEMP "sccache-extract")
          $Exe = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP "sccache-extract") -Recurse -Filter sccache.exe | Select-Object -First 1
          Copy-Item -LiteralPath $Exe.FullName -Destination (Join-Path $BinDir "sccache.exe") -Force
          & (Join-Path $BinDir "sccache.exe") --version
      - name: Compute cache keys
        id: cache-keys
        shell: pwsh
        run: |
          $Lock = Get-Content -LiteralPath "automation/dependencies.lock.json" -Raw | ConvertFrom-Json
          $Settings = Get-Content -LiteralPath "automation/settings.json" -Raw | ConvertFrom-Json
          $VsWhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $VsRoot = & $VsWhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $VsRoot) { throw "Visual Studio Desktop C++ workload not found" }
          $MsvcVersion = (Get-ChildItem (Join-Path $VsRoot "VC\Tools\MSVC") | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1).Name
          $FlagFiles = @(git ls-files -- 'CMakeLists.txt' 'cmake/*' 'apps/CMakeLists.txt' 'src/CMakeLists.txt' 'src/*/CMakeLists.txt' 'src/*/*/CMakeLists.txt' 'tests/CMakeLists.txt' 'bench/CMakeLists.txt' 'third_party/*/CMakeLists.txt' 'automation/build.ps1')
          if ($FlagFiles.Count -eq 0) { throw "Flag fingerprint found no CMake files; refusing to compute a cache key" }
          $FlagHash = [BitConverter]::ToString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes(($FlagFiles | ForEach-Object { (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash }) -join "|"))).Substring(0, 16).ToLowerInvariant()
          $DepHash = [BitConverter]::ToString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes("$($Lock.vcpkg_sha)$($Lock.ffmpeg.sha256)$($Lock.cuda_version)"))).Substring(0, 16).ToLowerInvariant()
          $Os = $env:RUNNER_OS.ToLowerInvariant()
          $Arch = $env:RUNNER_ARCH.ToLowerInvariant()
          $Schema = $Settings.build_cache.schema
          $SccPrefix = "ninfer-cache$Schema-sccache-$Os-$Arch-msvc$MsvcVersion-cuda$($Lock.cuda_version)-sm120a"
          $SccacheKey = "$($SccPrefix)-flags$FlagHash-deps$DepHash-sc$($Settings.build_cache.sccache.version)"
          $Out = @(
            "sccache_key=$SccacheKey",
            "sccache_restore1=$($SccPrefix)-flags$FlagHash-",
            "sccache_restore2=$($SccPrefix)-",
            "sccache_restore3=ninfer-cache$Schema-sccache-$Os-$Arch-",
            "vcpkgsrc_key=ninfer-cache$Schema-vcpkgsrc-$Os-$Arch-$($Lock.vcpkg_sha)",
            "vcpkgbin_key=ninfer-cache$Schema-vcpkgbin-$Os-$Arch-msvc$MsvcVersion-triplet-x64-windows-vcpkg$($Lock.vcpkg_sha)",
            "vcpkgbin_restore=ninfer-cache$Schema-vcpkgbin-$Os-$Arch-msvc$MsvcVersion-triplet-x64-windows-",
            "ffmpeg_key=ninfer-cache$Schema-ffmpeg-$($Lock.ffmpeg.sha256)"
          )
          Set-Content -LiteralPath $env:GITHUB_OUTPUT -Value $Out
      - name: Restore compiler caches
        id: compiler-caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            D:\ninfer-cache\sccache-cpp
            D:\ninfer-cache\sccache-cuda
          key: ${{ steps.cache-keys.outputs.sccache_key }}
          restore-keys: |
            ${{ steps.cache-keys.outputs.sccache_restore1 }}
            ${{ steps.cache-keys.outputs.sccache_restore2 }}
            ${{ steps.cache-keys.outputs.sccache_restore3 }}
      - name: Restore vcpkg checkout
        id: vcpkg-checkout
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\ninfer-cache\vcpkg
          key: ${{ steps.cache-keys.outputs.vpkgsrc_key }}
      - name: Restore vcpkg binary cache
        id: vcpkg-binary
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\ninfer-cache\vpkg-bin
          key: ${{ steps.cache-keys.outputs.vpkgbin_key }}
          restore-keys: |
            ${{ steps.cache-keys.outputs.vpkgbin_restore }}
      - name: Restore FFmpeg archive
        id: ffmpeg
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\ninfer-cache\ffmpeg
          key: ${{ steps.cache-keys.outputs.ffmpeg_key }}
      - name: Corrupt restored sccache entries (R6)
        if: inputs.corrupt_cache == 'true'
        shell: pwsh
        run: |
          $Entries = Get-ChildItem -Path "D:\ninfer-cache\sccache-cpp" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 200
          if ($Entries.Count -eq 0) { throw "R6 precondition failed: no sccache entries to corrupt (cache was cold)" }
          foreach ($Entry in $Entries) { Set-Content -LiteralPath $Entry.FullName -Value "ninfer-cache-verify-corruption-probe" -NoNewline }
          Write-Host "R6: corrupted $($Entries.Count) sccache entries; a safe cache must now miss them and recompile"
      - name: Validate Python automation
        shell: pwsh
        run: python -m compileall -q automation
      - name: Configure build and package Windows runtime
        shell: pwsh
        env:
          NINFER_CACHE_ROOT: D:\ninfer-cache
          NINFER_SCCACHE: D:\ninfer-cache\sccache-bin\sccache.exe
          NINFER_SCCACHE_CUDA: ${{ inputs.cuda_cache && 'on' || 'off' }}
        run: ./automation/build.ps1
      - name: Report cache metrics
        if: always()
        shell: pwsh
        run: |
          $Lines = New-Object System.Collections.Generic.List[string]
          $Lines.Add("## NInfer cache verification run")
          $Metrics = $null
          if (Test-Path "build/cache-metrics.json") { $Metrics = Get-Content -LiteralPath "build/cache-metrics.json" -Raw | ConvertFrom-Json }
          if ($null -ne $Metrics) {
              $Lines.Add("| metric | value |")
              $Lines.Add("| --- | --- |")
              foreach ($Prop in $Metrics.PSObject.Properties) {
                  $Value = [string]$Prop.Value
                  if ($Value.Length -gt 300) { $Value = $Value.Substring(0, 300) + "..." }
                  $Lines.Add("| $($Prop.Name) | $($Value -replace '\|', '/' -replace "`r?`n", ' ') |")
              }
          } else {
              $Lines.Add("no cache metrics written")
          }
          foreach ($Step in @("compiler-caches", "vcpkg-checkout", "vcpkg-binary", "ffmpeg")) {
              $Prop = $steps.PSObject.Properties[$Step]
              if ($null -ne $Prop) { $Lines.Add("$Step restore cache-hit=" + $Prop.Value.outputs["cache-hit"]) }
          }
          $Lines | Set-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
      - name: Save compiler caches
        if: success()
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            D:\ninfer-cache\sccache-cpp
            D:\ninfer-cache\sccache-cuda
          key: ${{ steps.cache-keys.outputs.sccache_key }}
      - name: Save vcpkg checkout
        if: success()
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\ninfer-cache\vpkg
          key: ${{ steps.cache-keys.outputs.vpkgsrc_key }}
      - name: Save vcpkg binary cache
        if: success()
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\ninfer-cache\vpkg-bin
          key: ${{ steps.cache-keys.outputs.vpkgbin_key }}
      - name: Save FFmpeg archive
        if: success()
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\ninfer-cache\ffmpeg
          key: ${{ steps.cache-keys.outputs.ffmpeg_key }}
