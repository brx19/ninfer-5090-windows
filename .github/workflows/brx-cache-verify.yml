name: BRX cache verification

# Scratch workflow for proving the build-cache behavior on hosted Windows runners
# without touching the release pipeline. It builds the checked-out ref directly (no
# sync, no candidate, no publication, no GPU job), so a candidate is never published
# from a verification run. Inputs map to the verification scenarios:
#   cuda_cache    - route NVCC through sccache (off by default, off until proven)
#   corrupt_cache - after restoring the compiler cache, corrupt a few sccache entries
#                   to prove that per-entry content addressing degrades to a recompile
#                   instead of producing a wrong binary
on:
  workflow_dispatch:
    inputs:
      cuda_cache:
        description: Route NVCC through sccache (R7 parity run)
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
      corrupt_cache:
        description: Corrupt restored sccache entries to verify safe fallback (R6)
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

concurrency:
  group: cache-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: '13.3.0'
          method: network
          sub-packages: '["nvcc", "crt", "cudart", "thrust", "nvrtc", "nvrtc_dev", "nvjitlink", "nvfatbin", "nvtx", "nvvm", "visual_studio_integration"]'
      - name: Install pinned sccache
        shell: pwsh
        run: |
          $Settings = Get-Content -LiteralPath "automation/settings.json" -Raw | ConvertFrom-Json
          $Pin = $Settings.build_cache.sccache
          $BinDir = Join-Path "D:\ninfer-cache" "sccache-bin"
          New-Item -ItemType Directory -Force -Path $BinDir | Out-Null
          $Zip = Join-Path $env:RUNNER_TEMP "sccache.zip"
          Invoke-WebRequest -Uri $Pin.url -OutFile $Zip
          $Hash = (Get-FileHash -LiteralPath $Zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($Hash -ne $Pin.sha256) { throw "sccache archive SHA256 mismatch: expected $($Pin.sha256), got $Hash" }
          Expand-Archive -LiteralPath $Zip -DestinationPath (Join-Path $env:RUNNER_TEMP "sccache-extract")
          $Exe = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP "sccache-extract") -Recurse -Filter sccache.exe | Select-Object -First 1
          Copy-Item -LiteralPath $Exe.FullName -Destination (Join-Path $BinDir "sccache.exe") -Force
          & (Join-Path $BinDir "sccache.exe") --version
      - name: Compute cache keys
        id: cache-keys
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Lock = Get-Content -LiteralPath "automation/dependencies.lock.json" -Raw | ConvertFrom-Json
          $Settings = Get-Content -LiteralPath "automation/settings.json" -Raw | ConvertFrom-Json
          $VsWhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $VsRoot = & $VsWhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $VsRoot) { throw "Visual Studio Desktop C++ workload not found" }
          $MsvcVersion = (Get-ChildItem (Join-Path $VsRoot "VC\Tools\MSVC") | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1).Name
          # Key derivation lives in automation/cache_keys.py so the compatibility
          # boundaries are unit-tested (automation/test_cache.py) instead of duplicated in
          # PowerShell. It reads the locked dependencies + settings from the checkout,
          # fingerprints the CMake flag inputs (byte-identical to the legacy computation),
          # and prints name=value lines that become this step's outputs.
          $KeyLines = @(python automation/cache_keys.py --repo-root . --msvc $MsvcVersion --os $env:RUNNER_OS --arch $env:RUNNER_ARCH)
          if ($LASTEXITCODE -ne 0) { throw "cache_keys.py failed" }
          Set-Content -LiteralPath $env:GITHUB_OUTPUT -Value $KeyLines
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Set-Content -LiteralPath "build/cache-keys.txt" -Value $KeyLines
          $Val = { param($n) $l = ($KeyLines | Where-Object { $_ -like "$n=*" } | Select-Object -First 1); if ($l) { $l.Split('=', 2)[1] } }
          Write-Host "MSVC toolset      : $MsvcVersion"
          Write-Host "flag fingerprint  : $( & $Val 'flag_hash')"
          Write-Host "dependency hash   : $( & $Val 'dep_hash')"
          Write-Host "sccache key       : $( & $Val 'sccache_key')"
          Write-Host "restore prefix    : $( & $Val 'sccache_restore1')"
          Write-Host "vcpkg checkout key: $( & $Val 'vcpkgsrc_key')"
          Write-Host "vcpkg binary key  : $( & $Val 'vcpkgbin_key')"
          Write-Host "ffmpeg key        : $( & $Val 'ffmpeg_key')"
      - name: Restore compiler caches
        id: compiler-caches
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            D:\ninfer-cache\sccache-cpp
            D:\ninfer-cache\sccache-cuda
          key: ${{ steps.cache-keys.outputs.sccache_key }}
          # A single restore prefix — the compatibility boundary (schema, os, arch, MSVC,
          # CUDA, sm_120a, flag fingerprint). A source or FFmpeg change moves only the
          # snapshot identity after the prefix, so the latest compatible snapshot restores
          # and sccache content addressing decides which objects hit.
          restore-keys: |
            ${{ steps.cache-keys.outputs.sccache_restore1 }}
      - name: Record restored compiler-cache size
        shell: pwsh
        run: |
          $Bytes = [int64]0
          foreach ($Dir in @("D:\ninfer-cache\sccache-cpp","D:\ninfer-cache\sccache-cuda")) {
              if (Test-Path $Dir) {
                  $Sum = (Get-ChildItem -Path $Dir -Recurse -File -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum
                  if ($null -ne $Sum) { $Bytes += [int64]$Sum }
              }
          }
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Set-Content -LiteralPath "build/restored-sccache-bytes.txt" -Value "$Bytes"
          Write-Host "restored compiler cache: $Bytes bytes before build"
      - name: Restore vcpkg checkout
        id: vcpkg-checkout
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\ninfer-cache\vcpkg
          key: ${{ steps.cache-keys.outputs.vcpkgsrc_key }}
      - name: Restore vcpkg binary cache
        id: vcpkg-binary
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\ninfer-cache\vcpkg-bin
          key: ${{ steps.cache-keys.outputs.vcpkgbin_key }}
          restore-keys: |
            ${{ steps.cache-keys.outputs.vcpkgbin_restore }}
      - name: Restore FFmpeg archive
        id: ffmpeg
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\ninfer-cache\ffmpeg
          key: ${{ steps.cache-keys.outputs.ffmpeg_key }}
      - name: Corrupt restored sccache entries (R6)
        if: inputs.corrupt_cache == 'true'
        shell: pwsh
        run: |
          $Entries = Get-ChildItem -Path "D:\ninfer-cache\sccache-cpp" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 200
          if ($Entries.Count -eq 0) { throw "R6 precondition failed: no sccache entries to corrupt (cache was cold)" }
          foreach ($Entry in $Entries) { Set-Content -LiteralPath $Entry.FullName -Value "ninfer-cache-verify-corruption-probe" -NoNewline }
          Write-Host "R6: corrupted $($Entries.Count) sccache entries; a safe cache must now miss them and recompile"
      - name: Validate Python automation
        shell: pwsh
        run: python -m compileall -q automation
      - name: Configure build and package Windows runtime
        shell: pwsh
        env:
          NINFER_CACHE_ROOT: D:\ninfer-cache
          NINFER_SCCACHE: D:\ninfer-cache\sccache-bin\sccache.exe
          NINFER_SCCACHE_CUDA: ${{ inputs.cuda_cache == 'true' && 'on' || 'off' }}
        run: ./automation/build.ps1
      - name: Report cache metrics
        if: always()
        shell: pwsh
        env:
          COMPILER_CACHE_HIT: ${{ steps['compiler-caches'].outputs['cache-hit'] }}
          VCPKG_SOURCE_CACHE_HIT: ${{ steps['vcpkg-checkout'].outputs['cache-hit'] }}
          VCPKG_BINARY_CACHE_HIT: ${{ steps['vcpkg-binary'].outputs['cache-hit'] }}
          FFMPEG_CACHE_HIT: ${{ steps['ffmpeg'].outputs['cache-hit'] }}
        run: |
          $Lines = New-Object System.Collections.Generic.List[string]
          $Lines.Add("## NInfer cache verification run")
          $KeyLines = @()
          if (Test-Path "build/cache-keys.txt") { $KeyLines = @(Get-Content -LiteralPath "build/cache-keys.txt" -ErrorAction SilentlyContinue) }
          $Val = { param($n) $l = ($KeyLines | Where-Object { $_ -like "$n=*" } | Select-Object -First 1); if ($l) { $l.Split('=', 2)[1] } }
          $CompilerHit = [string]$env:COMPILER_CACHE_HIT
          $RestoredBytes = 0
          if (Test-Path "build/restored-sccache-bytes.txt") {
              $rb = (Get-Content -LiteralPath "build/restored-sccache-bytes.txt" -ErrorAction SilentlyContinue | Select-Object -First 1)
              if ($rb -match '^\d+$') { $RestoredBytes = [int64]$rb }
          }
          $RestoreMode = if ($CompilerHit -eq 'true') { 'exact hit' } elseif ($RestoredBytes -gt 0) { "prefix fallback ($([math]::Round($RestoredBytes/1MB,1)) MiB restored)" } else { 'cold miss' }
          $Lines.Add("| field | value |")
          $Lines.Add("| --- | --- |")
          $Lines.Add("| workflow branch | $(${env:GITHUB_REF}) |")
          $Lines.Add("| restore mode | $RestoreMode |")
          $Lines.Add("| exact key | $( & $Val 'sccache_key') |")
          $Lines.Add("| restore prefix | $( & $Val 'sccache_restore1') |")
          $Lines.Add("| snapshot identity | $( & $Val 'sccache_identity') |")
          $Lines.Add("| cache schema | $( & $Val 'schema') |")
          $Lines.Add("| MSVC toolset | $( & $Val 'msvc_version') |")
          $Lines.Add("| CUDA version | $( & $Val 'cuda_version') (sm_120a) |")
          $Lines.Add("| sccache version | $( & $Val 'sccache_version') |")
          $Lines.Add("| flag fingerprint | $( & $Val 'flag_hash') |")
          $Lines.Add("| dependency fingerprint | $( & $Val 'dep_hash') |")
          $Lines.Add("| FFmpeg SHA256 | $( & $Val 'ffmpeg_sha256') |")
          $Lines.Add("| vcpkg revision | $( & $Val 'vcpkg_sha') |")
          $Lines.Add("| cuda_cache routing | $((if ($env:NINFER_SCCACHE_CUDA -eq 'on') { 'sccache' } else { 'nvcc (bypass)' })) |")
          $Metrics = $null
          if (Test-Path "build/cache-metrics.json") { $Metrics = Get-Content -LiteralPath "build/cache-metrics.json" -Raw | ConvertFrom-Json }
          if ($null -ne $Metrics) {
              $Lines.Add("| metric | value |")
              $Lines.Add("| --- | --- |")
              foreach ($Prop in $Metrics.PSObject.Properties) {
                  $Value = [string]$Prop.Value
                  if ($Value.Length -gt 300) { $Value = $Value.Substring(0, 300) + "..." }
                  $Lines.Add("| $($Prop.Name) | $($Value -replace '\|', '/' -replace "`r?`n", ' ') |")
              }
          } else {
              $Lines.Add("no cache metrics written")
          }
          foreach ($Name in @("COMPILER", "VCPKG_SOURCE", "VCPKG_BINARY", "FFMPEG")) {
              $Hit = [string][System.Environment]::GetEnvironmentVariable($Name + "_CACHE_HIT")
              if ($Hit.Trim().Length -gt 0) { $Lines.Add("$Name restore cache-hit=$Hit") } else { $Lines.Add("$Name restore cache-hit=unavailable") }
          }
          $Lines | Set-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
      - name: Save compiler caches
        if: success() && inputs.corrupt_cache != 'true' && steps['compiler-caches'].outputs['cache-hit'] != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            D:\ninfer-cache\sccache-cpp
            D:\ninfer-cache\sccache-cuda
          key: ${{ steps.cache-keys.outputs.sccache_key }}
      - name: Save vcpkg checkout
        if: success() && inputs.corrupt_cache != 'true' && steps['vcpkg-checkout'].outputs['cache-hit'] != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\ninfer-cache\vcpkg
          key: ${{ steps.cache-keys.outputs.vcpkgsrc_key }}
      - name: Save vcpkg binary cache
        if: success() && inputs.corrupt_cache != 'true' && steps['vcpkg-binary'].outputs['cache-hit'] != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\ninfer-cache\vcpkg-bin
          key: ${{ steps.cache-keys.outputs.vcpkgbin_key }}
      - name: Save FFmpeg archive
        if: success() && inputs.corrupt_cache != 'true' && steps['ffmpeg'].outputs['cache-hit'] != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: D:\ninfer-cache\ffmpeg
          key: ${{ steps.cache-keys.outputs.ffmpeg_key }}
      - name: Rotate compiler-cache snapshots
        # Bounded retention: keep the newest 3 compatible sccache snapshots, delete older
        # ones under our prefix only. Guarded and non-fatal so a cache-API problem never
        # fails the verification run. Skipped on corrupt_cache runs (R6) which must not
        # touch retention.
        if: success() && inputs.corrupt_cache != 'true'
        continue-on-error: true
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Restore1 = (Get-Content -LiteralPath "build/cache-keys.txt" -ErrorAction SilentlyContinue | Where-Object { $_ -like 'sccache_restore1=*' } | Select-Object -First 1)
          if (-not $Restore1) { Write-Host "retention> no restore prefix recorded; skipping"; exit 0 }
          $Prefix = $Restore1.Split('=', 2)[1]
          python automation/retention.py --repo "$env:GITHUB_REPOSITORY" --prefix $Prefix --keep 3 --out build/cache-retention.json
